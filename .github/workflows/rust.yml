name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        path: arbitrage-scouter
    # kraken-ws-v2 is a path dependency at ../kraken-ws-v2 until it is
    # published; check it out as a sibling so the build resolves. Once the
    # crate is on crates.io, drop this step and the path key in Cargo.toml.
    - uses: actions/checkout@v4
      with:
        repository: zimmah/kraken-ws-v2
        path: kraken-ws-v2
    - name: Build
      run: cargo build --verbose
      working-directory: arbitrage-scouter
    - name: Run tests
      run: cargo test --verbose
      working-directory: arbitrage-scouter
