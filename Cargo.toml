[package]
name = "kraken-arbitrage-scouter"
version = "0.0.1"
edition = "2024"
authors = ["Zimmah <zimmah@gmail.com>"]
license = "MIT"
description = "Real-time cryptocurrency arbitrage detection using async Rust and Tokio"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# WebSocket (uses vendored OpenSSL - no system dependencies needed)
tokio-tungstenite = { version = "0.24", features = ["native-tls-vendored"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
