[package]
name = "kraken-arbitrage-scouter"
version = "0.0.1"
edition = "2024"
authors = ["Zimmah <zimmah@gmail.com>"]
license = "MIT"
description = "Real-time cryptocurrency arbitrage detection using async Rust and Tokio"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Kraken WebSocket v2 market data: connection, reconnect, subscriptions,
# checksum-validated order books. Path dependency until it is on crates.io.
kraken-ws-v2 = { version = "0.1.0", path = "../kraken-v2-ws" }

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Error handling at the application boundary
anyhow = "1.0"

# Utilities
chrono = "0.4"
rust_decimal = "1.40.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
